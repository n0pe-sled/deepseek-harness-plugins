# The dsh-clear-session-history bundle layer: one row that is BOTH the node-half
# entry and the browser-roster entry (client-modules scans enabled Loader
# entries for packages declaring `dsh.client`). Activation is service-
# availability driven: the node half injects `sessionPersistence`, `sessions`,
# `workspaceRegistry` and `typert` (all mounted by dsh-base / the host
# composition), and the browser half injects `remote` (mounted by the web-app
# bundle's client composition). The browser half registers nothing into slots:
# it augments the two existing sidebar surfaces (workspace menu, New Session
# button area) from its own DOM integration.

- insert:
    - id: clear-session-history
      name: dsh-clear-session-history
